const veh=o=>inp(o,'plaka','Plaka')+inp(o,'marka','Marka')+inp(o,'model','Model')+(o==='other'?inp(o,'sahip','Araç sahibi'):inp(o,'yil','Model yılı','number'));

['Konum ve Zaman',()=>{const l=cur.loc,d=new Date(cur.created);return `<h2>📍 Kaza Konumu</h2><div class="card"><b>${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</b> • ${d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}<label>Tarih ve saat (değiştirebilirsiniz)<input type="datetime-local" data-dt value="${new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}"></label></div>`+(cur.gs=='wait'?'<div class="card c">⏳ <b>Konumunuz alınıyor...</b></div>':l.lat&&cur.gs=='ok'?`<div class="card"><b style="color:var(--ok)">✓ Konum kaydedildi</b><svg viewBox="0 0 300 110" width="100%"><rect width="300" height="110" rx="12" fill="#dfe7f3"/><path d="M0 70 L300 40" stroke="#fff" stroke-width="14"/><path d="M110 0 L150 110" stroke="#fff" stroke-width="10"/><text x="150" y="62" font-size="38" text-anchor="middle">📍</text></svg><p>${(+l.lat).toFixed(5)}, ${(+l.lng).toFixed(5)}${l.acc?` (±${Math.round(l.acc)} m)`:''}</p><a class="m" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lng}#map=17/${l.lat}/${l.lng}">Haritada aç (internet gerekir)</a></div>`:`<div class="warn">Konum alınamadı. Konumu manuel girebilirsiniz.</div>`)+`<button class="btn g s" data-a="geo">🔄 Konumu yeniden al</button><h3>Konumu manuel seç</h3>${inp('loc','adres','Adres / yer tarifi (ör. Karabük, D100 Yenişehir çıkışı)')}${inp('loc','lat','Enlem (isteğe bağlı)','number')}${inp('loc','lng','Boylam (isteğe bağlı)','number')}`}],

const cardOf=c=>{const D=new Date(c.created),arch=!!c.archived;return `<div class="card case-card ${arch?'archived':''}"><div class="case-top"><span class="case-date">${D.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>${c.done?'<span class="case-badge">TAMAMLANDI</span>':'<span class="case-badge">TASLAK</span>'}</div><div class="case-meta"><div>📍 ${e(placeOf(c))}</div><div>🚗 ${c.type=='tek'?1:2}${c.type=='cok'?'+':''} araç · ${TYPES[c.type]?.[1]||'Kaza kaydı'}</div></div>${arch?'':`<button class="btn s" data-open="${c.id}">${c.done?'Dosyayı Gör':'Devam Et'} <span aria-hidden="true">›</span></button>`}<div class="case-actions"><button class="btn s archive" data-a="${arch?'unarchive':'archive'}" data-v="${c.id}">${arch?'↩ Arşivden çıkar':'🗃️ Arşivle'}</button><button class="btn s danger" data-a="delete-case" data-v="${c.id}">🗑️ Sil</button></div></div>`};
const legal=`<p class="m" style="margin-top:20px">⚖️ ${LEGAL}</p>`;
const V={home:()=>`<div class="brand"><div class="brand-mark"><div class="brand-icon">✦</div><div class="brand-name">Kaza<span>Cep</span></div></div><div class="brand-status"><i></i> Cihazda güvenli</div></div><div class="hero"><div class="hero-kicker"><i></i> Hazır olduğunuzda yanınızdayız</div><h1>Kaza anında<br><span>yanınızda.</span></h1><p class="m hero-copy">Bilgileri, fotoğrafları ve belgeleri güvenli şekilde adım adım kaydedin.</p><button class="sos" data-a="start">📝 KAZA KAYDI BAŞLAT<small>Güvenli bir yerdeyseniz başlayın</small></button></div><div class="section-head"><h3>📁 Kaza Dosyalarım</h3>${activeCases().length?`<span class="section-link" data-nav="files">Tümünü gör ›</span>`:''}</div>${activeCases().slice(0,2).map(cardOf).join('')||'<div class="empty"><div style="font-size:28px">🗂️</div><p class="m">Henüz kaza dosyası yok.</p></div>'}<div class="section-head"><h3>📄 Belgelerim</h3><span class="section-link" data-nav="docs">Düzenle ›</span></div><div class="card doc-card" data-nav="docs"><div><b>${S.P.plaka?'🚗 '+e(S.P.plaka):'Belgelerinizi önceden kaydedin'}</b><p class="m">${S.P.plaka||S.P.rOn?`${S.P.rOn?'Ruhsat ✓  ':''}${S.P.eOn?'Ehliyet ✓  ':''}${S.P.pdoc?'Poliçe ✓':''}`:'Kaza anında otomatik doldurulur.'}</p></div><span class="doc-arrow">›</span></div>${legal}`,
files:()=>`<h2>📁 Kaza Dosyalarım</h2>${activeCases().map(cardOf).join('')||'<p class="m">Henüz aktif kaza dosyası yok.</p>'}${archivedCases().length?`<h3>🗃️ Arşivlenenler</h3>${archivedCases().map(cardOf).join('')}`:''}`,
docs:()=>`<h2>📄 Belgelerim</h2><p class="m">Burada kaydettikleriniz yeni kazada otomatik kullanılır.</p><div class="card"><h4>🚗 Aracım</h4>${veh('P')}</div><div class="card"><div class="doc-title"><h4>📄 Ruhsat</h4>${docBadge(!!(S.P.rOn&&S.P.rArka))}</div>${fl('P','rOn','Ön yüz',0,1)}${fl('P','rArka','Arka yüz',0,1)}</div><div class="card"><div class="doc-title"><h4>👤 Ehliyet</h4>${docBadge(!!(S.P.eOn&&S.P.eArka))}</div>${fl('P','eOn','Ön yüz',0,1)}${fl('P','eArka','Arka yüz',0,1)}</div><div class="card"><div class="doc-title"><h4>🛡️ Sigorta</h4>${docBadge(!!(S.P.sirket&&S.P.pdoc))}</div>${ins('P')}</div><button class="btn red" style="width:100%;margin-top:4px" data-a="save-docs">💾 Belgelerimi Kaydet</button><p class="m c" style="margin-top:10px">Bilgileriniz bu cihazda güvenle saklanır.</p>`,
prof:()=>`<h2>👤 Profil</h2><div class="card">${inp('P','ad','Ad Soyad')}${inp('P','tel','Telefon','tel')}${inp('P','kimlik','Kimlik bilgileri (TC No)')}${inp('P','sinif','Ehliyet sınıfı')}</div><div class="card"><b>🔒 Veri güvenliği</b><p class="m">Tüm bilgiler yalnızca bu cihazda, tarayıcınızın özel deposunda saklanır; başka kullanıcılar göremez. Sunucu eşitlemesi için altyapı hazırdır (her dosyada “eşitlendi” bayrağı).</p></div>${legal}<button class="btn g" data-a="wipe">Tüm verilerimi sil</button>`,
case:()=>{const c=cur,s=sec(c);return `<button class="btn g s" data-nav="files">‹ Dosyalarım</button><h2>📁 Kaza Dosyası</h2><div class="card"><b>${new Date(c.created).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</b><div>📍 ${e(placeOf(c))}</div><b>${TYPES[c.type]?.[1]||'Kaza'}</b></div><button class="btn red" style="width:100%" data-a="pdf">📄 PDF OLUŞTUR</button><p class="m c">Açılan pencerede “PDF olarak kaydet” seçin.</p><div class="tabs">${TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div><div class="card">${s[tab]}</div><button class="btn g s" data-a="edit">✏️ Düzenle</button>${legal}`}};
const nav=()=>`<div class="nv">${[['home','⌂','Ana Sayfa'],['files','▣','Dosyalar'],['docs','▤','Belgeler'],['prof','◉','Profil']].map(([k,i,l])=>`<a data-nav="${k}" class="${view==k||(k=='files'&&view=='case')?'on':''}"><i>${i}</i>${l}</a>`).join('')}</div>`;
const wiz=()=>{const o=order(),p=o.indexOf(step),last=p==o.length-1,po=pord(),skip=step==3&&PH[pi-1][2]&&!any(cur.ph[pi]);const dis=(step==1&&!cur.type)||(step==3&&!PH[pi-1][2]&&!any(cur.ph[pi]));return `<div class="m"><b>${p+1} / ${o.length} – ${STEPS[step][0]}</b></div><div class="bar"><div style="width:${(p+1)/o.length*100}%"></div></div>${STEPS[step][1]()}<p class="m" style="margin-top:20px">⚖️ ${LEGAL}</p><div class="ft"><button class="btn g" data-a="back">‹ Geri</button><button class="btn ${last?'red':''}" data-a="next" ${dis?'disabled':''}>${step==0?'Güvendeyim, devam et':last?'KAZA DOSYASINI OLUŞTUR':skip?'Atla':'Devam ›'}</button></div>`};
function render(top){const y=scrollY;if(view=='wiz'){cur.step=step;cur.pi=pi;save()}$('#app').innerHTML=view=='wiz'?wiz():V[view]()+(view=='case'?'':nav());if(view=='wiz'&&step==11)sketch();scrollTo(0,top?0:y)}
function geo(){cur.gs='wait';render();if(!navigator.geolocation){cur.gs='fail';return render()}navigator.geolocation.getCurrentPosition(p=>{cur.loc.lat=p.coords.latitude;cur.loc.lng=p.coords.longitude;cur.loc.acc=p.coords.accuracy;cur.gs='ok';save();step==2&&view=='wiz'&&render()},()=>{cur.gs='fail';save();step==2&&view=='wiz'&&render()},{timeout:12000,enableHighAccuracy:true})}
function enter(){if(step==2&&!cur.gs)geo();else render(1)}
function start(){cur={id:Date.now(),created:new Date().toISOString(),type:'',loc:{},ph:{},my:JSON.parse(JSON.stringify(S.P)),other:{},wit:[],wa:'',dk:{},desc:'',sketch:'',sk:[],done:false,synced:false};S.cases.unshift(cur);step=0;pi=1;view='wiz';save();render(1)}
function sketch(){const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d');cv.width=600;cv.height=700;let tool='move',dr=null,ln=null;const rk=i=>i.t=='l'?(i.k=='road'?0:1):2;
const draw=()=>{x.fillStyle='#eef1f6';x.fillRect(0,0,600,700);x.lineCap=x.lineJoin='round';[...cur.sk].sort((a,b)=>rk(a)-rk(b)).forEach(i=>{if(i.t=='l'){x.beginPath();i.p.forEach((q,n)=>n?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(i.k=='road'){x.strokeStyle='#9aa3b5';x.lineWidth=90;x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([16,14]);x.stroke();x.setLineDash([])}else{x.strokeStyle='#d92d20';x.lineWidth=6;x.stroke();const n=i.p.length;if(n>1){const a=i.p[n-1],b=i.p[Math.max(0,n-6)],g=Math.atan2(a[1]-b[1],a[0]-b[0]);x.beginPath();[-.5,.5].forEach(d=>{x.moveTo(a[0],a[1]);x.lineTo(a[0]+30*Math.cos(g+Math.PI+d),a[1]+30*Math.sin(g+Math.PI+d))});x.stroke()}}}else{x.font='64px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(i.e,i.x,i.y)}})};
const pos=v=>{const r=cv.getBoundingClientRect();return[(v.clientX-r.left)*600/r.width,(v.clientY-r.top)*700/r.height]};const fin=()=>{cur.sketch=cv.toDataURL('image/png');save()};
cv.onpointerdown=v=>{const[px,py]=pos(v);cv.setPointerCapture(v.pointerId);if(tool=='move'){dr=[...cur.sk].reverse().find(i=>i.t!='l'&&Math.hypot(i.x-px,i.y-py)<50)}else{ln={t:'l',k:tool,p:[[px,py]]};cur.sk.push(ln)}};
cv.onpointermove=v=>{const q=pos(v);if(dr){dr.x=q[0];dr.y=q[1]}else if(ln)ln.p.push(q);else return;draw()};cv.onpointerup=()=>{if(dr||ln){dr=ln=null;fin()}};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('on',z==b))});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cur.sk.push({t:'i',e:b.dataset.add,x:200+Math.random()*200,y:300+Math.random()*100});draw();fin()});
$('[data-un]').onclick=()=>{cur.sk.pop();draw();fin()};draw()}
// ---- Olaylar
document.addEventListener('input',v=>{const t=v.target;if(t.dataset.dt!==undefined){const d=new Date(t.value);if(!isNaN(d)){cur.created=d.toISOString();save()}}else if(t.dataset.k){ref(t.dataset.o)[t.dataset.k]=t.value;save()}else if(t.dataset.w){const[i,k]=t.dataset.w.split('|');cur.wit[i][k]=t.value;save()}});
document.addEventListener('change',async v=>{const t=v.target;if(!t.dataset.f)return;const[o,k,m]=t.dataset.f.split('|'),ob=ref(o);for(const f of t.files){const d=await rd(f);if(+m)(ob[k]=ob[k]||[]).push(d);else ob[k]=d}save();render()});
document.addEventListener('click',v=>{const t=v.target.closest('[data-a],[data-d],[data-go],[data-nav],[data-open],[data-tab]');if(!t)return;const D=t.dataset;
if(D.d){const[o,k,i,m]=D.d.split('|'),ob=ref(o);+m?ob[k].splice(i,1):delete ob[k];save();return render()}
if(D.tab){tab=D.tab;return render()}
if(D.nav){view=D.nav;return render(1)}
if(D.go){step=+D.go;if(step==3)pi=pord()[0];return enter()}
if(D.open){cur=S.cases.find(c=>c.id==D.open);if(cur.done){view='case';tab='olay'}else{view='wiz';step=cur.step||0;pi=cur.pi||1}return render(1)}
switch(D.a){case'start':start();break;
case'type':cur.type=D.v;save();render();break;case'geo':geo();break;case'save-docs':{save();const b=t.closest('[data-a]');if(b){const label=b.innerHTML;b.innerHTML='✓ Kaydedildi';b.disabled=true;setTimeout(()=>{b.innerHTML=label;b.disabled=false},1800)}break;}
case'wa':cur.wa=D.v;if(D.v=='e'&&!cur.wit.length)cur.wit.push({});save();render();break;case'addw':cur.wit.push({});render();break;case'delw':cur.wit.splice(D.v,1);render();break;
case'back':{const o=order(),po=pord();if(step==3&&pi!=po[0]){pi=po[po.indexOf(pi)-1];render(1)}else if(step==0){view='home';render(1)}else{step=o[o.indexOf(step)-1];if(step==3)pi=po[po.length-1];enter()}break}
case'next':{const o=order(),po=pord();if(step==3&&pi!=po[po.length-1]){pi=po[po.indexOf(pi)+1];render(1)}else if(step==o[o.length-1]){cur.done=true;cur.synced=false;save();view='case';tab='olay';render(1)}else{step=o[o.indexOf(step)+1];if(step==3)pi=po[0];enter()}break}
case'edit':cur.done=false;view='wiz';step=order().slice(-1)[0];render(1);break;case'archive':{const c=S.cases.find(x=>x.id==D.v);if(c){c.archived=true;save();render(1)}break;}case'unarchive':{const c=S.cases.find(x=>x.id==D.v);if(c){c.archived=false;save();render(1)}break;}case'delete-case':{if(confirm('Bu kaza dosyası kalıcı olarak silinsin mi?')){S.cases=S.cases.filter(x=>x.id!=D.v);save();view='files';render(1)}break;}
case'pdf':{const s=sec(cur);$('#rep').innerHTML=`<h1>KAZACEP KAZA DOSYASI</h1>`+TABS.map(([k,l])=>`<h2>${l}</h2>${s[k]}`).join('')+`<p style="font-size:10pt;margin-top:20px">${LEGAL}</p>`;setTimeout(()=>print(),150);break}
case'wipe':if(confirm('Tüm kaza dosyaları ve belgeler silinsin mi?')){S={P:{},cases:[],lastSaved:0};save();view='home';render(1)}}});
idb().then(load).then(()=>{localLoaded=true;render();if(fbReady)pullCloud()});
</script></body></html>
